<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171717">
  <title>Bağlantı bekleniyor | Fethiye Alfa Spor</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:#f4f4f4;color:#171717;font-family:Arial,Helvetica,sans-serif}main{max-width:480px;text-align:center}img{width:96px;height:96px;border-radius:22px}.eyebrow{margin-top:32px;font-size:11px;font-weight:700;letter-spacing:.2em}h1{font-size:clamp(30px,7vw,44px);letter-spacing:-.045em;line-height:1.1}p{color:#555;line-height:1.7}button,a{display:inline-flex;align-items:center;justify-content:center;min-height:48px;margin:8px 4px;padding:12px 20px;border-radius:8px;border:1px solid #171717;font:700 14px Arial;text-decoration:none;cursor:pointer}button{background:#171717;color:white}a{color:#171717}button:focus-visible,a:focus-visible{outline:3px solid #666;outline-offset:4px}small{display:block;margin-top:28px;color:#666;letter-spacing:.08em}
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" width="96" height="96" alt="Alfa Spor arması">
    <p class="eyebrow">FETHİYE ALFA SPOR</p>
    <h1>Bağlantı gelince<br>yeniden sahadayız.</h1>
    <p>İnternet bağlantınızı kontrol edip tekrar deneyin. Haberler ve maç sonuçları için güncel bağlantı gerekiyor.</p>
    <button type="button" onclick="window.location.reload()">Tekrar dene</button>
    <a href="/">Ana sayfa</a>
    <small>BİR TAKIM. BİR RÜYA.</small>
  </main>
</body>
</html>
